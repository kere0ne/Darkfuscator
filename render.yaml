# Render blueprint: the site and the REST API run in one zero-dependency
# Node service (tools/serve.js serves site/ and /api/v1/*).
services:
  - type: web
    name: darkfuscator
    runtime: node
    buildCommand: yarn install
    startCommand: yarn start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DK_SYNC_REPO
        value: kere0ne/darkfuscator-data
      - key: DK_SYNC_TOKEN
        sync: false
