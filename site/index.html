<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darkfuscator</title>
<meta name="description" content="Darkfuscator — Luau obfuscator with a custom bytecode VM. Maximum protection applied automatically. 100% client-side.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">D</div>
      <div class="brand-name">DARKFUSCATOR</div>
    </div>
    <nav class="nav">
      <a class="nav-item active" href="index.html">Obfuscator</a>
      <a class="nav-item" href="docs.html">Docs</a>
      <a class="nav-item" href="dashboard.html">Dashboard</a>
    </nav>
    <div class="sidebar-foot">
      <div class="ver-chip">v5.1</div>
      <div class="foot-note">100% client-side.<br>Nothing leaves your browser.</div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1>Obfuscator</h1>
        <p class="tagline">Maximum protection applied automatically to every build.</p>
      </div>
      <span id="status" class="status"></span>
    </header>

    <div class="grid">
      <section class="pane" id="pane-in">
        <div class="pane-head">
          <span class="pane-title">Input</span>
          <span id="inmeta" class="meta"></span>
        </div>
        <textarea id="input" spellcheck="false" placeholder="Paste Luau here, or drop a .luau file anywhere"></textarea>
        <div class="pane-actions">
          <button id="protect" class="btn primary">Obfuscate</button>
          <button id="validate" class="btn ghost">Validate</button>
          <button id="browse" class="btn ghost">Open file</button>
          <button id="clear" class="btn ghost">Clear</button>
          <input type="file" id="file" accept=".lua,.luau,.txt" hidden>
        </div>
      </section>

      <section class="pane" id="pane-out">
        <div class="pane-head">
          <span class="pane-title">Protected output</span>
          <span class="head-right">
            <span class="badge" id="verified-badge" hidden>verified</span>
            <span id="outmeta" class="meta"></span>
          </span>
        </div>
        <textarea id="output" spellcheck="false" readonly placeholder="Output appears here"></textarea>
        <div class="pane-actions">
          <button id="copy" class="btn ghost">Copy</button>
          <button id="download" class="btn ghost">Download</button>
          <button id="btn-publish" class="btn ghost">Publish loader</button>
        </div>
      </section>
    </div>

    <div id="error" class="error-box" hidden></div>

    <div id="stats" class="stats" hidden>
      <div class="chip"><span class="chip-k">protos</span><span class="chip-v" id="st-protos">0</span></div>
      <div class="chip"><span class="chip-k">opcodes</span><span class="chip-v" id="st-opcodes">0</span></div>
      <div class="chip"><span class="chip-k">bytecode</span><span class="chip-v" id="st-bytes">0</span></div>
      <div class="chip"><span class="chip-k">payload</span><span class="chip-v" id="st-payload">0</span></div>
      <div class="chip"><span class="chip-k">size</span><span class="chip-v" id="st-size">0</span></div>
      <div class="chip"><span class="chip-k">time</span><span class="chip-v" id="st-time">0</span></div>
      <div class="chip"><span class="chip-k">seed</span><span class="chip-v" id="st-seed">0</span></div>
    </div>
  </main>
</div>
<script src="js/luau-lexer.js"></script>
<script src="js/luau-parser.js"></script>
<script src="js/vm-compile.js"></script>
<script src="js/lz.js"></script>
<script src="js/vm-emit.js"></script>
<script src="js/obfuscate.js"></script>
<script src="js/app.js"></script>
</body>
</html>
