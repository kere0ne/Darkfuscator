<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Darkfuscator</title>
<script>try{var t=localStorage.getItem('dk_theme');document.documentElement.setAttribute('data-theme',t||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-body">
<main class="auth-wrap">
  <section class="card auth-card">
    <a class="brand auth-brand" href="/"><span>Darkfuscator</span></a>
    <h1 id="auth-title">Sign in</h1>
    <p id="auth-sub" class="dim"></p>
    <form id="auth-form" onsubmit="return false"></form>
    <div id="auth-links" class="auth-alt"></div>
  </section>
  <p class="dim tiny" id="api-ok" hidden>API reachable</p>
</main>
<script src="/js/ui.js"></script>
<script src="/js/auth-spa.js"></script>
</body>
</html>
