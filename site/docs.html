<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docs · Darkfuscator</title>
<meta name="description" content="Darkfuscator documentation: pipeline, bytecode format and VM internals.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0;background:#0b0608;color:#f5eee8;font-family:"DM Sans",sans-serif;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.top a{color:#ff7a1a;text-decoration:none;font-weight:600}
h1{font-size:28px;margin:0 0 6px}
.sub{color:#b9a99e;font-size:14px;margin-bottom:24px}
.tabs{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
.tab{padding:8px 16px;border:1px solid #2a1a12;border-radius:10px;background:#140b10;color:#b9a99e;cursor:pointer;font:inherit;font-size:14px}
.tab.on{border-color:#ff7a1a;color:#ff7a1a}
article{line-height:1.7;font-size:15px}
article h2{color:#ff7a1a;font-size:20px;margin:32px 0 10px}
article h3{font-size:16px;margin:24px 0 8px}
article pre{background:#140b10;border:1px solid #2a1a12;border-radius:12px;padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.55}
article code{font-family:ui-monospace,Menlo,Consolas,monospace}
article p code,article li code{background:#1d0f16;border-radius:5px;padding:1px 5px;font-size:12.5px}
article ul{padding-left:22px}
article a{color:#ffb347}
.err{color:#ff5a5a}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><b>Darkfuscator</b><a href="index.html">← Back to the tool</a></div>
<h1>Documentation</h1>
<p class="sub">How the pipeline, bytecode format and interpreter work. The same pages live in the repo under <code>docs/</code>.</p>
<div class="tabs" id="tabs"></div>
<article id="content"><p class="sub">Loading…</p></article>
</div>
<script>
(function(){
  var DOCS=[['ARCHITECTURE','Pipeline'],['BYTECODE','Bytecode format'],['VM','Interpreter']];
  var tabs=document.getElementById('tabs'),content=document.getElementById('content');
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function md(src){
    var out=[],inCode=false,lines=esc(src).split('\n'),i;
    for(i=0;i<lines.length;i++){
      var L=lines[i];
      if(L.indexOf('```')===0){ out.push(inCode?'</pre>':'<pre>'); inCode=!inCode; continue; }
      if(inCode){ out.push(L); continue; }
      if(/^#### /.test(L)) out.push('<h3>'+L.slice(5)+'</h3>');
      else if(/^### /.test(L)) out.push('<h3>'+L.slice(4)+'</h3>');
      else if(/^## /.test(L)) out.push('<h2>'+L.slice(3)+'</h2>');
      else if(/^# /.test(L)) out.push('<h2>'+L.slice(2)+'</h2>');
      else if(/^[-*] /.test(L)) out.push('<ul data-one><li>'+inl(L.slice(2))+'</li></ul>');
      else if(/^\s*$/.test(L)) out.push('');
      else out.push('<p>'+inl(L)+'</p>');
    }
    if(inCode) out.push('</pre>');
    return out.join('\n').replace(/<\/ul>\n<ul data-one>/g,'\n');
  }
  function inl(s){
    return s
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  }
  function load(name){
    content.innerHTML='<p class="sub">Loading…</p>';
    fetch('docs/'+name+'.md').then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(t){ content.innerHTML=md(t); })
      .catch(function(){ content.innerHTML='<p class="err">Could not load this page.</p>'; });
  }
  DOCS.forEach(function(d,i){
    var b=document.createElement('button');
    b.className='tab'+(i===0?' on':''); b.textContent=d[1];
    b.onclick=function(){ [].forEach.call(tabs.children,function(c){c.classList.remove('on');}); b.classList.add('on'); load(d[0]); };
    tabs.appendChild(b);
  });
  load(DOCS[0][0]);
})();
</script>
</body>
</html>
