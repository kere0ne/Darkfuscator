<!doctype html>
<html lang="en" data-theme="dark" data-accent="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - Darkfuscator</title>
<script>try{var t=localStorage.getItem('dk_theme');document.documentElement.setAttribute('data-theme',t||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="pre-boot">
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/dashboard" data-route="/dashboard"><img src="/assets/logo.png" alt="Darkfuscator"><span class="brand-name">Darkfuscator</span></a>
    <nav id="nav">
      <a data-route="/dashboard" href="/dashboard"><span class="n-ico">01</span>Dashboard</a>
      <a data-route="/obfuscate" href="/obfuscate"><span class="n-ico">02</span>Obfuscate</a>
      <a data-route="/projects" href="/projects"><span class="n-ico">03</span>Projects</a>
      <a data-route="/history" href="/history"><span class="n-ico">04</span>History</a>
      <a data-route="/api-keys" href="/api-keys"><span class="n-ico">05</span>API Keys</a>
      <a data-route="/docs" href="/docs"><span class="n-ico">06</span>Documentation</a>
    </nav>
    <div class="side-foot">
      <div class="sys-item"><span class="sys-dot ok" id="sys-dot"></span><span class="dim" id="sys-note">system</span></div>
      <div class="side-actions">
        <button class="btn sm ghost" id="palette-btn" title="Search (Ctrl+K)">Ctrl+K</button>
        <button class="btn sm ghost" id="theme-toggle">Light</button>
      </div>
      <a id="nav-user" href="/account" class="side-user mono" data-route="/account">user</a>
    </div>
  </aside>
  <main class="app-main">
    <header class="app-topbar">
      <h1 id="view-title">Dashboard</h1>
      <div class="acct-menu-wrap">
        <button class="btn sm" id="acct-menu-btn" aria-label="Account menu"><span id="greet-line">Welcome back</span></button>
        <div id="acct-menu" class="acct-menu">
          <div class="am-head"><span id="acct-menu-name" class="mono"></span><span id="acct-menu-email" class="dim"></span><span id="acct-verified" class="badge ok" hidden>verified</span></div>
          <a href="/account" data-route="/account">Account</a>
          <a href="/settings" data-route="/settings">Settings</a>
          <a href="/api-keys" data-route="/api-keys">API keys</a>
          <a href="/logout">Sign out</a>
        </div>
      </div>
    </header>
    <div id="view-root"><div class="view-loading">Loading</div></div>
  </main>
</div>
<nav class="mobile-nav">
  <a data-route="/dashboard" href="/dashboard">Home</a>
  <a data-route="/obfuscate" href="/obfuscate">Obfuscate</a>
  <a data-route="/projects" href="/projects">Projects</a>
  <a data-route="/history" href="/history">History</a>
  <a data-route="/settings" href="/settings">Settings</a>
</nav>
<script src="/js/luau-lexer.js"></script>
<script src="/js/luau-parser.js"></script>
<script src="/js/examples.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/editor.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
