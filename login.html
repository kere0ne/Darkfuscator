<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Darkfuscator</title>
<meta name="description" content="Sign in to Darkfuscator to manage your account and API key.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#08080a;color:#f2f2f4;font-family:"DM Sans",sans-serif;padding:20px;box-sizing:border-box}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(600px 400px at 20% 10%,rgba(255,255,255,.05),transparent 60%),radial-gradient(500px 500px at 85% 90%,rgba(255,255,255,.03),transparent 60%);pointer-events:none}
.auth-card{position:relative;width:100%;max-width:420px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:36px 32px;backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;text-decoration:none}
.brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#fff,#9a9aa4);color:#0a0a0c;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.brand .name{font-weight:700;font-size:16px;letter-spacing:.04em;color:#f2f2f4}
.auth-tabs{display:flex;gap:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tab{flex:1;padding:9px 0;text-align:center;border:0;border-radius:9px;background:transparent;color:#9a9aa4;font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
.auth-tab.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:#9a9aa4;margin-bottom:6px;font-weight:500}
.field input{width:100%;box-sizing:border-box;padding:11px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#f2f2f4;font:inherit;font-size:14px;outline:none;transition:border-color .15s}
.field input:focus{border-color:rgba(255,255,255,.35)}
.hint{font-size:11.5px;color:#71717a;margin-top:5px}
.btn-primary{width:100%;padding:12px 0;margin-top:6px;border:0;border-radius:11px;background:linear-gradient(135deg,#ffffff,#c9c9d1);color:#0a0a0c;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .15s}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}
.form-note{font-size:13px;border-radius:9px;padding:9px 12px;margin-bottom:14px;line-height:1.5}
.form-error{background:rgba(255,90,90,.09);border:1px solid rgba(255,90,90,.25);color:#ff8a8a}
.form-ok{background:rgba(120,255,170,.07);border:1px solid rgba(120,255,170,.2);color:#7de8a8}
.foot{margin-top:20px;text-align:center;font-size:12.5px;color:#71717a}
.foot a{color:#c9c9d1;text-decoration:none;font-weight:500}
.foot a:hover{color:#fff}
.auth-home{position:fixed;top:18px;left:20px;color:#9a9aa4;text-decoration:none;font-size:13.5px;font-weight:500}
.auth-home:hover{color:#fff}
</style>
</head>
<body>
<a class="auth-home" href="index.html">&larr; Darkfuscator</a>

<div class="auth-card">
  <a class="brand" href="index.html">
    <div class="mark">DF</div>
    <div class="name">DARKFUSCATOR</div>
  </a>

  <div class="auth-tabs">
    <button class="auth-tab on" data-tab="login" type="button">Sign in</button>
    <button class="auth-tab" data-tab="signup" type="button">Create account</button>
  </div>

  <form id="form-login" novalidate>
    <div id="err-login" class="form-note form-error" hidden></div>
    <div class="field">
      <label for="li-identifier">Username or email</label>
      <input id="li-identifier" type="text" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="li-password">Password</label>
      <input id="li-password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn-primary" type="submit">Sign in</button>
    <div class="foot">New here? <a href="#signup" id="link-signup">Create an account</a> &middot; every account gets a free API key</div>
  </form>

  <form id="form-signup" hidden novalidate>
    <div id="err-signup" class="form-note form-error" hidden></div>
    <div class="field">
      <label for="su-username">Username</label>
      <input id="su-username" type="text" autocomplete="username" required>
      <div class="hint">3-20 characters: letters, numbers, underscore</div>
    </div>
    <div class="field">
      <label for="su-email">Email</label>
      <input id="su-email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="su-password">Password</label>
      <input id="su-password" type="password" autocomplete="new-password" required>
      <div class="hint">At least 8 characters, with a letter and a number</div>
    </div>
    <button class="btn-primary" type="submit">Create account</button>
    <div class="foot">An API key is generated with your account &middot; <a href="docs.html">API docs</a></div>
  </form>
</div>

<script src="js/auth.js"></script>
<script>
(function(){
  var link = document.getElementById('link-signup');
  if (link) link.addEventListener('click', function(e){
    e.preventDefault();
    var tabs = document.querySelectorAll('.auth-tab');
    for (var i=0;i<tabs.length;i++) if (tabs[i].getAttribute('data-tab')==='signup') tabs[i].click();
  });
})();
</script>
</body>
</html>
